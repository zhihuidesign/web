name: Feishu Table Automation Sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# 💡 核心升级：告诉 GitHub 提前强制开启 Node 24 新版引擎，消灭警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: python -m pip install requests

      - name: Run Fetch Script
        run: python sync.py

      - name: Commit and Push
        run: |
          git config --global user.name \"Feishu Sync Bot\"
          git config --global user.email \"bot@github.com\"
          git add api/data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m \"Update data\" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
