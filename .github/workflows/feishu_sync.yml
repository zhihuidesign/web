name: Feishu Table Automation Sync

on:
  schedule:
    - cron: '0 * * * *' # 每小时自动执行一次
  workflow_dispatch: # 允许你随时在 GitHub 页面上点按钮手动执行

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Fetch Script
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          import os, json, requests
          
          APP_ID = os.environ.get("FEISHU_APP_ID")
          APP_SECRET = os.environ.get("FEISHU_APP_SECRET")
          BASE_ID = "L3gAbHr0vaDklls2gfQcjdEmnjf"
          
          res = requests.post("https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal", json={"app_id": APP_ID, "app_secret": APP_SECRET})
          token = res.json().get("tenant_access_token")
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json; charset=utf-8"}
          
          def get_records(table_id):
              records = []
              url = f"https://open.feishu.cn/open-apis/bitable/v1/apps/{BASE_ID}/tables/{table_id}/records?page_size=100"
              while url:
                  try:
                      r = requests.get(url, headers=headers).json()
                      items = r.get("data", {}).get("items", [])
                      records.extend(items)
                      if r.get("data", {}).get("has_more", False):
                          pt = r.get("data", {}).get("page_token")
                          url = f"https://open.feishu.cn/open-apis/bitable/v1/apps/{BASE_ID}/tables/{table_id}/records?page_size=100&page_token={pt}"
                      else:
                          url = None
                  except:
                      break
              return [x.get("fields", {}) for x in records]

          def parse_img(val):
              if not val: return ""
              if isinstance(val, list) and len(val) > 0:
                  return val[0].get("tmp_url", "")
              if isinstance(val, dict):
                  return val.get("tmp_url", "")
              return str(val)

          def parse_img_list(val):
              if not val: return []
              if isinstance(val, list):
                  return [x.get("tmp_url", "") for x in val if x.get("tmp_url")]
              return []
          
          raw_settings = get_records("tbl4yj6yMn9b6TVB")
          raw_banners = get_records("tbleKDTByw1PG3vB")
          raw_cases = get_records("tblLbJOrvKnT2dHR")
          raw_cocreate = get_records("tbl4z7agZYGzD8G0")
          
          final_data = {"settings": {}, "banners": [], "cases": []}
          
          for item in raw_settings:
              k = item.get("配置项")
              v = item.get("具体内容")
              if k: final_data["settings"][k] = v
              
          for item in raw_cocreate:
              k = item.get("配置项")
              v = item.get("具体内容")
              if k: final_data["settings"][k] = v
              
          for b in raw_banners:
              final_data["banners"].append({
                  "id": str(b.get("ID") or ""),
                  "title": b.get("标题") or "",
                  "image": parse_img(b.get("图片"))
              })
              
          for c in raw_cases:
              final_data["cases"].append({
                  "id": str(c.get("编号") or ""),
                  "title": c.get("项目标题") or "",
                  "category": c.get("栏目分类") or "",
                  "tag": c.get("副标题") or "",
                  "desc": c.get("项目描述") or "",
                  "images": parse_img_list(c.get("图片集")),
                  "featured": bool(c.get("精选推荐", False))
              })
              
          os.makedirs("api", exist_ok=True)
          with open("api/data.json", "w", encoding="utf-8") as f:
              json.dump(final_data, f, ensure_ascii=False, indent=4)
        shell: python

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Feishu Sync Bot"
          git config --global user.email "bot@github.com"
          git add api/data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Feishu data refresh" && git push)

      # 🌟 新增核心工序：强行通知并唤醒 GitHub 网页发布程序
      - name: Trigger GitHub Pages Deployment
        uses: actions/deploy-pages@v2
        if: always()
