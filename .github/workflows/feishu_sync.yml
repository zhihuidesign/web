name: Feishu Table Automation Sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Fetch Script
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          # [这里保留你原本的 Python 脚本逻辑，确保它能生成 api/data.json]
          python your_fetch_script.py 

      - name: Commit and Push
        run: |
          git config --global user.name "Feishu Sync Bot"
          git config --global user.email "bot@github.com"
          git add api/data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update data" && git push)

      # 关键点：这一步会自动触发 GitHub Pages 的构建与发布
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
